# Builds the SHIFT website (web/) with the data from the release "site-data" (site_data.zip,
# written by pipeline stage `export`) and publishes it on GitHub Pages (the official site). The same
# built files also go to a backup copy on Cloudflare Pages (job deploy-cloudflare, 13 Nov).
# Runs on every change to web/ or recent/, whenever a release is published or edited (a new
# site_data.zip), every 3 hours to refresh the recent detections (D38), and by hand
# (Actions > Website > Run workflow). To freeze the site during judging: Actions > Website >
# "..." > Disable workflow (and Enable it again afterwards). A failed recent-detections refresh
# keeps the last good snapshot (recent/snapshot.py). It never stops the deploy.
name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "recent/**", ".github/workflows/pages.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # recent detections refresh (D38). GitHub may start it late

# Least privilege (audit D6): the workflow and the build job can only read. Only the deploy job,
# which runs no project code and never sees the FIRMS key, may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read          # actions/configure-pages reads the Pages settings [UNCERTAIN: confirm on the first run]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch the site data (release site-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site-data -p site_data.zip -D "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          mkdir -p web/public/data
          unzip -q "$RUNNER_TEMP/site_data.zip" -d web/public/data
          test -f web/public/data/meta.json
          du -sh web/public/data
      # Recent detections (D38, raw FIRMS NRT), Task 2: a failed refresh keeps the last good snapshot.
      # 1. copy the snapshot the live site serves now (public files, no key, no write access)
      # 2. fetch a new one into a separate folder (the only step that gets the key)
      # 3. publish: the new snapshot if whole and complete, otherwise the previous one marked as
      #    a fallback (its own fetch time kept), otherwise nothing ("not available").
      # 4. final check: a snapshot that fails the checks is removed. None of this can stop the
      #    deploy or touch the historical record.
      - name: Recent detections, previous snapshot from the live site (read only)
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python3 recent/snapshot.py pull --site "$site" --to "$RUNNER_TEMP/recent_prev" || true
      - name: Recent detections, new fetch (the FIRMS key is given to this step only)
        id: fetch
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: |
          set +e
          python3 recent/fetch_firms.py --out "$RUNNER_TEMP/recent_new" --notfire web/public/data/notfire.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Recent detections, publish the new snapshot or keep the last good one
        continue-on-error: true
        env:
          FETCH_EXIT: ${{ steps.fetch.outputs.exit }}
        run: >-
          python3 recent/snapshot.py publish --candidate "$RUNNER_TEMP/recent_new"
          --fetch-exit "${FETCH_EXIT:-1}" --previous "$RUNNER_TEMP/recent_prev"
          --out web/public/data/recent --summary "$GITHUB_STEP_SUMMARY"
      - name: Recent detections, final check (a snapshot that fails is removed)
        run: |
          rm -rf web/public/data/.recent.staging web/public/data/.recent.old
          python3 recent/snapshot.py check web/public/data/recent || rm -rf web/public/data/recent
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write         # publish the built site
      id-token: write      # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Backup copy on Cloudflare Pages (13 Nov, Squadron Zero): the SAME files the build job made for
  # GitHub Pages, uploaded as they are. GitHub Pages stays the official site. This job runs no project
  # code (no checkout), cannot write to GitHub, never sees the FIRMS key, and gets the Cloudflare token
  # in its upload steps only. If it fails, the GitHub Pages deploy is not affected.
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_PROJECT: project-shift
    steps:
      - name: Get the built site (the artifact the GitHub Pages deploy uses)
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact
      - name: Unpack and check the Cloudflare free plan limits (20,000 files, 25 MiB per file)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/artifact/artifact.tar" -C "$RUNNER_TEMP/site"
          files=$(find "$RUNNER_TEMP/site" -type f | wc -l)
          big=$(find "$RUNNER_TEMP/site" -type f -size +25M | wc -l)
          echo "files=$files, files over 25 MiB=$big, size=$(du -sh "$RUNNER_TEMP/site" | cut -f1)"
          echo "Cloudflare copy: $files files, $big over 25 MiB" >> "$GITHUB_STEP_SUMMARY"
          test -f "$RUNNER_TEMP/site/index.html"
          test "$files" -le 20000
          test "$big" -eq 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create the Cloudflare Pages project once (an existing project is left as it is)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$CF_PROJECT"; then
            echo "Project $CF_PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch main
          fi
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" --project-name "$CF_PROJECT"
          --branch main --commit-hash "$GITHUB_SHA" --commit-message "Website run $GITHUB_RUN_NUMBER"
          --commit-dirty=true
